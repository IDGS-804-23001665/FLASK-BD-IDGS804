{% extends "layout.html" %}
{% block container %}
{% import "_macros.html" as macros %}

<div
    class="bg-white rounded-xl shadow-sm border border-slate-200 max-w-lg mx-auto p-8">
    <h2 class="text-xl font-bold text-slate-800 mb-6 flex items-center gap-2">
        <svg class="w-5 h-5 text-indigo-600" fill="none" viewBox="0 0 24 24"
            stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round"
                stroke-width="2"
                d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" />
        </svg>
        Nuevo Curso
    </h2>

    <form method="POST" action="{{ url_for('cursos.nuevo_curso') }}" novalidate>
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
        {{ macros.camposNuevos(form.nombre, class="input-field") }}
        {{ macros.camposNuevos(form.descripcion, class="input-field") }}

        <div class="mb-4">
            <label
                class="block text-sm font-semibold text-slate-700 mb-1">Maestro</label>
            <select name="maestro_id" class="input-field">
                {% for maes in maestros %}
                <option value="{{ maes.matricula }}">{{ maes.nombre }} {{
                    maes.apellidos }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="flex gap-3 mt-6">
            <button type="submit"
                class="bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-medium px-5 py-2 rounded-lg transition-colors">
                Guardar
            </button>
            <a href="{{ url_for('cursos.index') }}"
                class="bg-slate-100 hover:bg-slate-200 text-slate-700 text-sm font-medium px-5 py-2 rounded-lg transition-colors">
                Cancelar
            </a>
        </div>
    </form>
</div>
{% endblock %}
