{% extends "layout.html" %}
{% block container %}
{% import "_macros.html" as macros %}

<div
    class="bg-white rounded-xl shadow-sm border border-slate-200 max-w-lg mx-auto p-8">
    <h2 class="text-xl font-bold text-slate-800 mb-2 flex items-center gap-2">
        <svg class="w-5 h-5 text-red-500" fill="none" viewBox="0 0 24 24"
            stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round"
                stroke-width="2"
                d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
        </svg>
        Eliminar Curso
    </h2>

    <form method="POST"
        action="{{ url_for('cursos.eliminar_curso', id=form.id.data) }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
        {{ macros.camposNuevos(form.nombre, class="input-field", disabled=True)
        }}
        {{ macros.camposNuevos(form.descripcion, class="input-field",
        disabled=True) }}

        <div class="flex gap-3 mt-6">
            <button type="submit"
                class="bg-red-500 hover:bg-red-600 text-white text-sm font-medium px-5 py-2 rounded-lg transition-colors">
                Confirmar Eliminación
            </button>
            <a href="{{ url_for('cursos.index') }}"
                class="bg-slate-100 hover:bg-slate-200 text-slate-700 text-sm font-medium px-5 py-2 rounded-lg transition-colors">
                Cancelar
            </a>
        </div>
    </form>
</div>
{% endblock %}
