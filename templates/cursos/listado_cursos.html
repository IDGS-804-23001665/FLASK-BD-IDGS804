{% extends "layout.html" %}
{% block container %}

<div class="flex items-center justify-between mb-6">
    <h1 class="text-2xl font-bold text-slate-800">Cursos</h1>
    <a href="{{ url_for('cursos.nuevo_curso') }}"
        class="bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-medium px-4 py-2 rounded-lg flex items-center gap-2 transition-colors">
        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24"
            stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round"
                stroke-width="2" d="M12 4v16m8-8H4" />
        </svg>
        Nuevo
    </a>
</div>

<div
    class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
    <table class="w-full text-sm text-left">
        <thead
            class="bg-slate-50 text-slate-600 text-xs uppercase border-b border-slate-200">
            <tr>
                <th class="px-6 py-3">ID</th>
                <th class="px-6 py-3">Nombre</th>
                <th class="px-6 py-3">Maestro</th>
                <th class="px-6 py-3">Acciones</th>
            </tr>
        </thead>
        <tbody class="divide-y divide-slate-100">
            {% for curso in cursos %}
            <tr class="hover:bg-slate-50 transition-colors">
                <td class="px-6 py-4 text-slate-400 text-xs font-mono">{{
                    curso.id }}</td>
                <td class="px-6 py-4 font-medium text-slate-800">{{ curso.nombre
                    }}</td>
                <td class="px-6 py-4 text-slate-600">{{ curso.maestro.nombre }}
                    {{ curso.maestro.apellidos }}</td>
                <td class="px-6 py-4">
                    <div class="flex gap-2">
                        <a
                            href="{{ url_for('cursos.detalles_curso', id=curso.id) }}"
                            class="bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-medium px-3 py-1.5 rounded-md transition-colors">
                            Ver
                        </a>
                        <a
                            href="{{ url_for('cursos.modificar_curso', id=curso.id) }}"
                            class="bg-amber-100 hover:bg-amber-200 text-amber-700 text-xs font-medium px-3 py-1.5 rounded-md transition-colors">
                            Editar
                        </a>
                        <a
                            href="{{ url_for('cursos.eliminar_curso', id=curso.id) }}"
                            class="bg-red-100 hover:bg-red-200 text-red-700 text-xs font-medium px-3 py-1.5 rounded-md transition-colors">
                            Eliminar
                        </a>
                    </div>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
