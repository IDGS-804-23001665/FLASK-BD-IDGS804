{% macro camposNuevos(campo) %}
<div class="mb-4">
    <label class="block text-sm font-semibold text-slate-700 mb-1">
        {{ campo.label.text }}
    </label>
    {{ campo(**kwargs) | safe }}
    {% if campo.errors %}
    <ul class="mt-1">
        {% for error in campo.errors %}
        <li class="text-xs text-red-600 font-medium">{{ error }}</li>
        {% endfor %}
    </ul>
    {% endif %}
</div>
{% endmacro %}
