{% extends "layout.html" %}
{% block container %}

<div
    class="bg-white rounded-xl shadow-sm border border-slate-200 max-w-sm mx-auto p-8 text-center">
    <img class="w-24 h-24 rounded-full mx-auto mb-4 border-4 border-indigo-100"
        src="https://ui-avatars.com/api/?name={{ nombre }}+{{ apellidos }}&background=6366f1&color=fff&size=128"
        alt="Avatar" />
    <h3 class="text-xl font-bold text-slate-800">{{ nombre }} {{ apellidos
        }}</h3>
    <p class="text-sm text-slate-500 mt-1">{{ email }}</p>
    <p class="text-sm text-slate-500">{{ telefono }}</p>

    <div class="mt-6">
        <a href="{{ url_for('alumnos.index') }}"
            class="bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-medium px-5 py-2 rounded-lg transition-colors">
            Regresar
        </a>
    </div>
</div>
{% endblock %}
